<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브레인 스탑워치</title>
<style>
  :root { --h: 205; --f: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: #e8ecff;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background:
      radial-gradient(ellipse at 50% 24%, hsl(var(--h) 60% calc(12% + var(--f) * 10%) / .9), transparent 62%),
      #04050d;
    display: flex; justify-content: center; padding: 24px 16px 56px;
  }
  .layout { width: 100%; max-width: 460px; }
  .brain-box { position: relative; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 400 / 330; max-height: 46vh; object-fit: contain; }
  .stage { text-align: center; margin-top: -4px; min-height: 54px; }
  .stage .name {
    display: inline-block; font-size: 20px; font-weight: 600; letter-spacing: .08em;
    color: hsl(var(--h) 90% 74%); text-shadow: 0 0 18px hsl(var(--h) 90% 60% / .6);
  }
  .stage .name.pop { animation: pop .9s ease-out; }
  @keyframes pop {
    0% { transform: scale(.85); opacity: 0; filter: blur(6px); }
    40% { transform: scale(1.12); opacity: 1; filter: blur(0); }
    100% { transform: scale(1); }
  }
  .stage .sub { font-size: 13px; color: #a3abd0; margin-top: 4px; }

  .time {
    text-align: center; margin: 12px 0 4px; white-space: nowrap;
    font-size: clamp(52px, 16vw, 76px); font-weight: 250; line-height: 1.1;
    font-variant-numeric: tabular-nums; letter-spacing: -1px; color: #fff;
    text-shadow: 0 0 28px hsl(var(--h) 90% 60% / .55);
  }
  .time.long { font-size: clamp(42px, 13vw, 62px); }
  .meter { margin: 6px 6px 22px; }
  .meter-row { display: flex; justify-content: space-between; font-size: 12px; color: #a3abd0; margin-bottom: 6px; }
  .bar { height: 6px; border-radius: 3px; background: #131734; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, hsl(200 90% 60%), hsl(var(--h) 95% 68%));
    box-shadow: 0 0 12px hsl(var(--h) 95% 60% / .8);
  }
  .next { text-align: center; font-size: 12px; color: #a3abd0; margin-top: 7px; min-height: 16px; }

  .buttons { display: flex; justify-content: space-between; margin-bottom: 22px; }
  .buttons button {
    width: 84px; height: 84px; border-radius: 50%; cursor: pointer;
    font: inherit; font-size: 16px; font-weight: 600; color: #fff;
    border: 1px solid #ffffff33; background: #ffffff14;
    transition: transform .08s, background .2s, box-shadow .2s;
  }
  .buttons button:focus-visible, .tbtn:focus-visible { outline: 2px solid hsl(var(--h) 90% 75%); outline-offset: 3px; }
  .buttons button:active { transform: scale(.94); }
  .buttons button:disabled { opacity: .55; cursor: default; border-style: dashed; }
  #lapBtn.reset { border-color: #ffffff77; background: #ffffff22; }
  #startBtn {
    background: hsl(var(--h) 80% 45% / .38); border-color: hsl(var(--h) 90% 68% / .75);
    box-shadow: 0 0 22px hsl(var(--h) 90% 55% / .45);
  }
  #startBtn.running { background: hsl(38 90% 50% / .22); border-color: hsl(38 95% 62% / .85); box-shadow: 0 0 18px hsl(38 95% 55% / .35); }

  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid #ffffff1c; max-height: 240px; overflow-y: auto; }
  li {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: baseline;
    padding: 12px 4px; border-bottom: 1px solid #ffffff1c;
    font-variant-numeric: tabular-nums; font-size: 16px;
  }
  li .tot { color: #a3abd0; font-size: 13px; text-align: right; }
  li .badge { font-size: 12px; min-width: 3.4em; }
  li.best { color: #5eead4; }
  li.worst { color: #ff9bb0; }
  .hint { display: none; text-align: center; color: #a3abd0; font-size: 12px; margin-top: 20px; }
  @media (hover: hover) and (pointer: fine) { .hint { display: block; } }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center; padding: 10px 14px;
    background: #1a1e3c; border: 1px solid #ffffff2a; border-radius: 12px; font-size: 14px;
  }
  .toast[hidden] { display: none; }
  .tbtn { font: inherit; font-size: 14px; font-weight: 600; color: hsl(var(--h) 90% 78%); background: none; border: 0; cursor: pointer; padding: 6px 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-height: 700px) and (max-width: 899px) { canvas { max-height: 34vh; } }
  @media (min-width: 900px) {
    .layout { max-width: 1040px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px; align-items: center; }
    canvas { max-height: none; }
    body { align-items: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage .name.pop { animation: none; }
    .buttons button { transition: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <section aria-label="뇌 활성도 시각화">
    <div class="brain-box"><canvas id="brain" aria-hidden="true"></canvas></div>
    <div class="stage" aria-live="polite">
      <div class="name" id="stageName">휴면</div>
      <div class="sub" id="stageSub">시작하면 뇌가 깨어납니다</div>
    </div>
  </section>

  <section aria-label="스탑워치">
    <div class="time" id="display" role="timer" aria-live="off">00:00.00</div>

    <div class="meter">
      <div class="meter-row"><span id="meterLabel">뇌 활성도</span><span id="pct">0%</span></div>
      <div class="bar" id="bar" role="progressbar" aria-labelledby="meterLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barFill"></i></div>
      <div class="next" id="next"></div>
    </div>

    <div class="buttons">
      <button id="lapBtn" disabled aria-keyshortcuts="L">랩</button>
      <button id="startBtn" aria-keyshortcuts="Space">시작</button>
    </div>
    <ul id="laps" aria-label="랩 기록" tabindex="0"></ul>
    <p class="hint">Space 시작/정지 · L 랩 · R 재설정</p>
  </section>
</div>

<div class="toast" id="toast" hidden role="status">
  <span>기록을 초기화했습니다</span>
  <button class="tbtn" id="undoBtn">실행 취소</button>
</div>
<div class="sr" id="sr" aria-live="polite"></div>

<script>
/* ================= 스탑워치 ================= */
const $ = id => document.getElementById(id);
const display = $('display'), startBtn = $('startBtn'), lapBtn = $('lapBtn'), lapsEl = $('laps');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const LS = 'brainStopwatch.v2';

let running = false, startTime = 0, elapsed = 0, laps = [], lastLapTotal = 0, kick = 0;
const total = () => running ? elapsed + performance.now() - startTime : elapsed;

function fmt(ms) {
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60,
        m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
  const p = n => String(n).padStart(2, '0');
  return (h ? h + ':' + p(m) : p(m)) + ':' + p(s) + '.' + p(cs);
}
const announce = msg => { $('sr').textContent = ''; setTimeout(() => $('sr').textContent = msg, 30); };

function save() {
  try {
    localStorage.setItem(LS, JSON.stringify({
      running, elapsed, laps, lastLapTotal,
      startWall: running ? Date.now() - (performance.now() - startTime) : 0
    }));
  } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!s || typeof s.elapsed !== 'number' || !Array.isArray(s.laps)) return;
    elapsed = Math.max(0, s.elapsed); laps = s.laps; lastLapTotal = s.lastLapTotal || 0;
    if (s.running && s.startWall) { running = true; startTime = performance.now() - (Date.now() - s.startWall); }
  } catch (e) {}
}

function syncButtons() {
  startBtn.textContent = running ? '정지' : (elapsed > 0 ? '계속' : '시작');
  startBtn.classList.toggle('running', running);
  lapBtn.textContent = running ? '랩' : '재설정';
  lapBtn.disabled = !running && elapsed === 0;
  lapBtn.classList.toggle('reset', !running && elapsed > 0);
  lapBtn.setAttribute('aria-keyshortcuts', running ? 'L' : 'R');
}

function renderLaps() {
  lapsEl.innerHTML = '';
  if (!laps.length) return;
  let best = -1, worst = -1;
  if (laps.length >= 2) {
    const d = laps.map(l => l.d);
    best = d.indexOf(Math.min(...d)); worst = d.indexOf(Math.max(...d));
  }
  const rows = [];
  for (let i = laps.length - 1; i >= 0; i--) {
    const cls = i === best ? 'best' : i === worst ? 'worst' : '';
    const badge = i === best ? '▲ 최고' : i === worst ? '▼ 최저' : '';
    rows.push(`<li class="${cls}"><span>랩 ${i + 1}</span><span class="tot">${fmt(laps[i].t)}</span><span>${fmt(laps[i].d)}</span><span class="badge">${badge}</span></li>`);
  }
  lapsEl.innerHTML = rows.join('');
}

function toggle() {
  hideToast();
  if (running) {
    elapsed += performance.now() - startTime; running = false; announce('정지 ' + fmt(elapsed));
  } else {
    startTime = performance.now(); running = true;
    if (elapsed > 0 && !reduce) kick = 0.14;   // 재개: 다시 켜지는 느낌
    announce('시작');
  }
  syncButtons(); save();
}
function lap() {
  if (!running) return;
  const t = total(); laps.push({ d: t - lastLapTotal, t }); lastLapTotal = t; renderLaps(); save();
}
let undoSnap = null, toastTimer = 0;
function reset() {
  if (running || elapsed === 0) return;
  undoSnap = { elapsed, laps, lastLapTotal };
  elapsed = 0; laps = []; lastLapTotal = 0; renderLaps(); syncButtons(); save();
  display.textContent = fmt(0);
  $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 7000);
}
function hideToast() { $('toast').hidden = true; undoSnap = null; clearTimeout(toastTimer); }
$('undoBtn').addEventListener('click', () => {
  if (!undoSnap) return;
  ({ elapsed, laps, lastLapTotal } = undoSnap); undoSnap = null; $('toast').hidden = true;
  renderLaps(); syncButtons(); save(); announce('초기화를 취소했습니다');
});

startBtn.addEventListener('click', toggle);
lapBtn.addEventListener('click', () => running ? lap() : reset());
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (t && t.closest && t.closest('button') && (e.code === 'Space' || e.code === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'KeyL') lap();
  else if (e.code === 'KeyR') reset();
});

/* ================= 단계 / 활성도 곡선 ================= */
const STAGES = [
  { at: 0,    name: '시동',        sub: '첫 시냅스가 깜빡이기 시작합니다' },
  { at: 10,   name: '깨어나는 중', sub: '신호가 전두엽에서 퍼져 나갑니다' },
  { at: 30,   name: '집중',        sub: '신경망이 서로 연결되고 있어요' },
  { at: 120,  name: '몰입',        sub: '뇌 전체가 한 박자로 움직이기 시작합니다' },
  { at: 300,  name: '초몰입',      sub: '신경망이 최고 속도로 이어집니다' },
  { at: 900,  name: '심층 몰입',   sub: '깊은 곳까지 불이 켜졌어요' },
  { at: 1800, name: '플로우',      sub: '완전히 몰입한 상태입니다' },
];
const IDLE = { name: '휴면', sub: '시작하면 뇌가 깨어납니다' };
// [초, 활성도] — 사이는 smoothstep으로 이어 '계단 + 경사' 리듬을 만든다
const KEYS = [[0, .10], [10, .24], [30, .42], [120, .66], [300, .84], [900, .95], [1800, 1]];
function keyAct(sec) {
  if (sec >= KEYS[KEYS.length - 1][0]) return 1;
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, a0] = KEYS[i], [t1, a1] = KEYS[i + 1];
    if (sec < t1) { let s = (sec - t0) / (t1 - t0); s = s * s * (3 - 2 * s); return a0 + (a1 - a0) * s; }
  }
  return 1;
}
const targetAct = (sec, started, run) => !started ? 0 : keyAct(sec) * (run ? 1 : 0.45);
function stageFor(sec, started) {
  if (!started) return -1;
  let i = 0; for (let k = 0; k < STAGES.length; k++) if (sec >= STAGES[k].at) i = k; return i;
}

/* ================= 뇌 ================= */
const cv = $('brain'), ctx = cv.getContext('2d');
const W = 400, H = 330, CX = 205, CY = 150;
let scale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  const w = Math.min(r.width, r.height * W / H) || r.width;
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * H / W * dpr); scale = cv.width / W;
}
window.addEventListener('resize', resize); resize();

const cerebrum = new Path2D(
  'M52 168 C38 138 46 96 82 72 C108 52 148 42 182 44 C215 30 262 34 296 52 C336 66 362 104 356 146 ' +
  'C352 172 336 188 316 196 C300 202 284 200 268 204 C252 206 244 216 232 222 C214 226 200 240 170 242 ' +
  'C140 244 112 236 100 218 C92 208 80 206 68 196 C58 188 54 178 52 168Z');
const cerebellum = new Path2D('M268 206 C290 198 336 204 348 222 C354 244 322 262 292 256 C272 252 258 236 262 218 C263 212 265 208 268 206Z');
const stem = new Path2D('M212 226 C220 246 226 268 224 296 C236 300 246 298 252 294 C252 270 250 244 240 222Z');
const parts = [cerebrum, cerebellum, stem];
const folds = [
  'M110 160 C150 160 190 150 232 168',              // 외측구
  'M200 46 C196 80 206 104 192 132',                // 중심구
  'M300 54 C294 88 304 112 292 140',                // 두정후두구
  'M70 120 C90 108 112 120 132 104 C150 92 170 100 186 90',
  'M64 150 C84 140 100 150 122 138',
  'M140 195 C165 186 190 196 214 186 C232 178 250 186 268 176',
  'M236 100 C252 92 266 104 282 96',
  'M232 140 C256 130 282 140 306 128 C322 120 336 124 346 116',
  'M120 210 C140 204 156 210 176 206',
  'M310 160 C326 154 338 160 348 152',
  'M270 222 C295 214 330 218 346 230',              // 소뇌 줄무늬
  'M268 232 C292 226 326 230 344 240',
  'M272 242 C294 238 318 242 330 250',
].map(d => new Path2D(d));

let seed = 11; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const probe = document.createElement('canvas').getContext('2d');
const inside = (x, y) => parts.some(p => probe.isPointInPath(p, x, y));

const nodes = [];
for (let i = 0; i < 8000 && nodes.length < 240; i++) {
  const x = rnd() * W, y = rnd() * H;
  if (!inside(x, y)) continue;
  if (nodes.some(n => (n.x - x) ** 2 + (n.y - y) ** 2 < 13 * 13)) continue;
  nodes.push({ x, y, e: 0, order: 0, adj: [] });
}
const SEED = { x: 88, y: 118 };
let maxd = 0;
nodes.forEach(n => { n.d = Math.hypot(n.x - SEED.x, n.y - SEED.y); maxd = Math.max(maxd, n.d); });
nodes.forEach(n => { n.order = n.d / maxd * 0.95 + rnd() * 0.08; });
const edges = [], seen = new Set();
nodes.forEach((a, i) => {
  nodes.map((b, j) => ({ j, d: Math.hypot(a.x - b.x, a.y - b.y) }))
    .filter(o => o.j !== i && o.d < 32).sort((p, q) => p.d - q.d).slice(0, 3)
    .forEach(o => {
      const k = i < o.j ? i + '-' + o.j : o.j + '-' + i;
      if (seen.has(k)) return; seen.add(k);
      const ei = edges.length; edges.push({ a: i, b: o.j });
      nodes[i].adj.push(ei); nodes[o.j].adj.push(ei);
    });
});

/* 글로우 스프라이트 (색상이 바뀔 때만 다시 그림) */
const glow = document.createElement('canvas'); glow.width = glow.height = 64;
let spriteHue = -99;
function buildGlow(h) {
  const g = glow.getContext('2d'); g.clearRect(0, 0, 64, 64);
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `hsla(${h},90%,88%,1)`); gr.addColorStop(.3, `hsla(${h},90%,68%,.4)`); gr.addColorStop(1, `hsla(${h},90%,55%,0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); spriteHue = h;
}

/* 상태 */
load(); syncButtons(); renderLaps(); display.textContent = fmt(total());
let act = targetAct(total() / 1000, running || elapsed > 0, running);
let pulses = [], flash = 0, wavePos = -1, waveP = -1, waveDur = 1.2, rings = [];
let phase = 0, lastBeat = 0, stageIdx = -2, prevStage = -1;
let pctShown = -1, hueShown = -999, fShown = -1, secShown = -1, last = performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const awakeAt = a => 0.04 + a * 1.06;

function spawn(ei, from) {
  if (pulses.length > 160) return;
  pulses.push({ ei, from, p: 0, sp: (0.9 + rnd() * 0.9) * (0.8 + act) });
}
function randomAwakeEdge(th) {
  for (let k = 0; k < 8; k++) {
    const ei = (rnd() * edges.length) | 0, e = edges[ei];
    if (nodes[e.a].order < th && nodes[e.b].order < th) return ei;
  }
  return -1;
}

function frame(now) {
  if (document.hidden) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const ms = total(), sec = ms / 1000, started = running || elapsed > 0;

  // 활성도: 오를 땐 천천히(관성), 내려갈 땐 빠르게
  let tgt = targetAct(sec, started, running);
  if (kick) { act = Math.min(1, act + kick); kick = 0; }
  act += (tgt - act) * Math.min(1, dt * (tgt > act ? 0.9 : 2.4));

  // 단계 전환
  const si = stageFor(sec, started);
  if (si !== stageIdx) {
    const first = stageIdx === -2;
    prevStage = stageIdx; stageIdx = si;
    const s = si < 0 ? IDLE : STAGES[si];
    $('stageName').textContent = s.name; $('stageSub').textContent = s.sub;
    if (!first) {
      const el = $('stageName'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      if (si > prevStage && si >= 0 && !reduce) {
        flash = Math.min(1, 0.4 + 0.12 * si);
        waveP = 0; waveDur = 1.2 + 0.12 * si;
        const tier = Math.min(3, 1 + Math.floor(si / 2));
        for (let i = 0; i < tier; i++) rings.push({ t: -i * 0.22, a: 0.35 + 0.1 * si });
      }
    }
  }
  flash *= Math.exp(-dt * 2.6); if (flash < 0.01) flash = 0;

  // 색상
  const flowAmt = clamp((act - 0.8) / 0.2, 0, 1);
  const hue = 200 + 95 * act + 10 * flash + (reduce ? 0 : 7 * flowAmt * Math.sin(now / 1000 * 0.4));
  const hq = Math.round(hue / 2) * 2;
  if (hq !== hueShown) { hueShown = hq; document.documentElement.style.setProperty('--h', hq); }
  const fq = Math.round(flash * 20) / 20;
  if (fq !== fShown) { fShown = fq; document.documentElement.style.setProperty('--f', fq); }
  if (Math.abs(hue - spriteHue) >= 3) buildGlow(Math.round(hue));

  // UI 텍스트
  const pct = Math.round(act * 100);
  if (pct !== pctShown) {
    pctShown = pct; $('pct').textContent = pct + '%'; $('barFill').style.width = pct + '%';
    $('bar').setAttribute('aria-valuenow', pct);
  }
  display.textContent = fmt(ms);
  display.classList.toggle('long', ms >= 3600000);
  const sInt = Math.floor(sec);
  if (sInt !== secShown) {
    secShown = sInt;
    let nx = '';
    if (started) nx = si < STAGES.length - 1 ? `다음 단계 '${STAGES[si + 1].name}'까지 ${fmtShort(STAGES[si + 1].at - sec)}` : '최고 단계를 유지하고 있어요';
    $('next').textContent = nx;
    if (running && sInt > 0 && sInt % 60 === 0) announce(`${sInt / 60}분 경과`);
  }

  // 박동 — 활성도가 오를수록 빨라지고, 몰입 이후엔 뇌 전체가 같은 박자로 맥동
  phase += dt * (0.8 + 1.4 * act);
  if (Math.floor(phase) > lastBeat) {
    lastBeat = Math.floor(phase);
    const sync = clamp((act - 0.55) / 0.35, 0, 1), th0 = awakeAt(act);
    if (sync > 0 && !reduce && started) nodes.forEach(n => { if (n.order < th0) n.e = Math.max(n.e, sync * (0.35 + 0.25 * rnd())); });
  }

  // 신호 생성 (박동 위상으로 변조)
  const th = awakeAt(act), thSpawn = Math.max(th, 0.2);
  const beat = reduce ? 1 : 1 + 0.6 * Math.max(0, Math.sin(phase * 6.2832));
  const base = started ? (running ? 2 + act * 16 : 0.8 + act * 3) : 1.0;
  let n = base * beat * (reduce ? 0.4 : 1) * dt + rnd();
  while (n >= 1) { n -= 1; const ei = randomAwakeEdge(thSpawn); if (ei >= 0) spawn(ei, rnd() < .5 ? edges[ei].a : edges[ei].b); }

  // 파동: 부드러운 띠가 전두엽에서 후두엽까지 쓸고 지나감
  if (waveP >= 0) {
    waveP += dt / waveDur; wavePos = easeOut(Math.min(1, waveP)) * 1.2;
    nodes.forEach(nd => { const d = 1 - Math.abs(nd.order - wavePos) * 7; if (d > 0) nd.e = Math.max(nd.e, d); });
    if (waveP > 1.1) { waveP = -1; wavePos = -1; }
  }
  rings.forEach(r => r.t += dt / 1.7); rings = rings.filter(r => r.t < 1);

  // 펄스 전진 + 연쇄
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.p += dt * p.sp;
    if (p.p >= 1) {
      const e = edges[p.ei], to = p.from === e.a ? e.b : e.a;
      nodes[to].e = 1; pulses.splice(i, 1);
      if (rnd() < 0.3 + 0.55 * act) {
        const opts = nodes[to].adj.filter(x => x !== p.ei && nodes[edges[x].a].order < th && nodes[edges[x].b].order < th);
        if (opts.length) spawn(opts[(rnd() * opts.length) | 0], to);
      }
    }
  }
  const dec = Math.exp(-dt * 2.6);
  nodes.forEach(nd => { nd.e *= dec; if (nd.e < 0.005) nd.e = 0; });

  draw(now, th, hue);
  requestAnimationFrame(frame);
}
function fmtShort(s) { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60); return m ? `${m}분 ${String(s % 60).padStart(2, '0')}초` : `${s}초`; }

function draw(now, th, hue) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  const s = reduce ? 1 : 1 + 0.004 * (1 + 2 * act) * Math.sin(phase * 6.2832);
  ctx.setTransform(scale * s, 0, 0, scale * s, W * scale * (1 - s) / 2, H * scale * (1 - s) / 2);
  const col = (l, a, h = hue) => `hsla(${h},85%,${l}%,${a})`;
  const sat = 1 - 0.28 * clamp((act - 0.8) / 0.2, 0, 1);  // 고활성도 과노출 완화

  // 윤곽 + 주름
  ctx.lineWidth = 1.3; ctx.shadowColor = col(62, 1); ctx.shadowBlur = 4 + 14 * act + 34 * flash;
  ctx.strokeStyle = col(66, 0.36 + 0.36 * act + 0.25 * flash);
  parts.forEach(p => ctx.stroke(p)); ctx.shadowBlur = 0;
  ctx.lineWidth = 1; ctx.strokeStyle = col(62, 0.12 + 0.24 * act + 0.15 * flash);
  folds.forEach(p => ctx.stroke(p));

  // 연결선 — 두 묶음으로 일괄 stroke
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (const e of edges) { const a = nodes[e.a], b = nodes[e.b]; if (a.order < th && b.order < th) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); } }
  ctx.strokeStyle = col(68, (0.13 + 0.18 * act) * sat); ctx.stroke();
  ctx.beginPath();
  for (const e of edges) { const a = nodes[e.a], b = nodes[e.b]; if (!(a.order < th && b.order < th)) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); } }
  ctx.strokeStyle = col(50, 0.045); ctx.stroke();
  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b], k = a.e + b.e;
    if (k > 0.15) { ctx.strokeStyle = col(80, Math.min(0.8, k * 0.4)); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  }

  // 충격파 링
  for (const r of rings) {
    if (r.t <= 0) continue;
    ctx.strokeStyle = col(76, (1 - r.t) * r.a); ctx.lineWidth = 0.6 + 2.2 * (1 - r.t);
    ctx.beginPath(); ctx.arc(CX, CY, easeOut(r.t) * 280, 0, 6.2832); ctx.stroke();
  }

  ctx.globalCompositeOperation = 'lighter';
  for (const p of pulses) {
    const e = edges[p.ei], a = nodes[p.from], b = nodes[p.from === e.a ? e.b : e.a];
    const x = a.x + (b.x - a.x) * p.p, y = a.y + (b.y - a.y) * p.p;
    ctx.globalAlpha = 0.95 * sat; ctx.drawImage(glow, x - 8, y - 8, 16, 16);
  }
  const flow = (reduce ? 0 : 1);
  for (const n of nodes) {
    const on = n.order < th;
    const h = hue + (n.order - 0.5) * 26 * act * flow;     // 전두엽 → 후두엽 색 그라디언트
    if (n.e > 0.08) {
      const sz = 10 + 16 * n.e;
      ctx.globalAlpha = Math.min(1, n.e) * 0.75 * sat; ctx.drawImage(glow, n.x - sz / 2, n.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = col(on ? 78 : 55, Math.min(1, (on ? 0.42 + 0.3 * act : 0.18) + n.e * 0.7 + flash * 0.25), h);
    ctx.beginPath(); ctx.arc(n.x, n.y, 1.5 + n.e * 2.4, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = performance.now(); requestAnimationFrame(frame); } });
buildGlow(205);
requestAnimationFrame(frame);
</script>
